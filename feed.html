<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed - Fame Goal</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">Fame Goal</div>
            <div class="nav-search">
                <input type="text" placeholder="Search" id="searchInput">
            </div>
            <div class="nav-icons">
                <a href="feed.html" class="nav-icon">🏠</a>
                <a href="#" class="nav-icon">✉️</a>
                <a href="#" class="nav-icon" id="createPostBtn">➕</a>
                <a href="#" class="nav-icon">❤️</a>
                <a href="profile.html" class="nav-icon" id="profileIcon">👤</a>
            </div>
        </div>
    </nav>

    <div class="feed-container">
        <div class="feed-main">
            <div class="stories-section">
                <div class="story">
                    <div class="story-avatar">+</div>
                    <span>Your Story</span>
                </div>
            </div>

            <div id="postsContainer" class="posts-container">
                <!-- Posts will be dynamically loaded here -->
            </div>
        </div>

        <div class="feed-sidebar">
            <div class="profile-suggestion">
                <div class="suggestion-header">
                    <span>Suggestions For You</span>
                    <a href="#">See All</a>
                </div>
                <div id="suggestionsContainer">
                    <!-- User suggestions will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Create Post Modal -->
    <div id="createPostModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Create New Post</h2>
            <input type="file" id="postImage" accept="image/*">
            <textarea id="postCaption" placeholder="Write a caption..."></textarea>
            <button id="submitPost" class="btn-primary">Share</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/feed.js"></script>
</body>
</html>
